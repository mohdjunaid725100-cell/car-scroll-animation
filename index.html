<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITZFIZZ | Scroll Animation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
<style>body{background:#0A0A0A;color:white;font-family:Inter,sans-serif;overflow-x:hidden}.headline{font-family:Syne,sans-serif;letter-spacing:.35em}#car,#trail{will-change:transform}</style>
</head>
<body>
<section id="hero" class="h-screen w-full relative flex flex-col justify-center px-[6vw]">
<h1 id="headline" class="headline text-[11vw] md:text-[7vw] font-extrabold leading-[0.9]"><span class="block">WELCOME</span><span class="block text-[#22FF64]">ITZFIZZ</span></h1>
<div id="stats" class="flex gap-10 mt-10"><div class="stat"><h2 class="text-4xl font-bold">98%</h2><p class="text-[10px] text-white/40">CLIENT SATISFACTION</p></div><div class="stat"><h2 class="text-4xl font-bold">250+</h2><p class="text-[10px] text-white/40">PROJECTS</p></div><div class="stat"><h2 class="text-4xl font-bold">99%</h2><p class="text-[10px] text-white/40">UPTIME</p></div></div>
<div class="absolute bottom-[20%] left-[6vw] right-[6vw]"><div class="w-full h-[1px] bg-white/10"></div><div id="trail" class="h-[2px] bg-[#22FF64] w-full -mt-[2px] origin-left scale-x-0"></div><div id="car" class="absolute -top-10 left-0 w-20 h-8 bg-[#22FF64] rounded-md flex items-center justify-center"><span class="text-black font-bold text-xs">ITZ</span></div></div>
<p class="absolute bottom-6 left-[6vw] text-[9px] tracking-[0.4em] text-white/30">SCROLL TO DRIVE</p>
</section>
<section class="h-screen bg-[#111] flex items-center justify-center"><p class="text-white/30">Animation Completed</p></section>
<script>gsap.registerPlugin(ScrollTrigger);gsap.from("#headline",{y:60,opacity:0,duration:1.2,ease:"power4.out"});gsap.from(".stat",{y:30,opacity:0,duration:.8,stagger:.2,delay:.5});gsap.to("#car",{x:()=>window.innerWidth-150,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"+=100%",scrub:1.5,pin:true}});gsap.to("#trail",{scaleX:1,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"+=100%",scrub:1.5}});</script>
</body>
</html>
